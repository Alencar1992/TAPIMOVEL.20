name: P7 corrigir último teste modular

on:
  push:
    branches:
      - agent/p7-pedido-service
    paths:
      - .github/workflows/p7-corrigir-online-final.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p7-pedido-service
          fetch-depth: 0

      - name: Corrigir teste do fluxo online
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/frontend-integrity.test.js')
          texto = p.read_text(encoding='utf-8')
          marcador = 'test("fluxo de pedidos online aguarda aceite, alerta o PDV e prepara WhatsApp", () => {'
          inicio = texto.find(marcador)
          if inicio < 0:
              raise SystemExit('Teste do fluxo online não encontrado.')

          antigo = '  const backend = fs.readFileSync(path.join(root, "apps-script/Code.gs"), "utf8");'
          pos = texto.find(antigo, inicio)
          if pos < 0:
              raise SystemExit('Leitura antiga de Code.gs não encontrada no teste do fluxo online.')

          proximo_teste = texto.find('\ntest(', inicio + len(marcador))
          if proximo_teste >= 0 and pos > proximo_teste:
              raise SystemExit('A leitura encontrada não pertence ao teste esperado.')

          novo = '''  const appsScriptDir = path.join(root, "apps-script");
          const backend = fs.readdirSync(appsScriptDir)
            .filter(nome => nome.endsWith(".gs"))
            .sort()
            .map(nome => fs.readFileSync(path.join(appsScriptDir, nome), "utf8"))
            .join("\\n\\n");'''

          texto = texto[:pos] + novo + texto[pos + len(antigo):]
          p.write_text(texto, encoding='utf-8')
          PY

      - name: Limpar diagnóstico final
        shell: bash
        run: |
          rm -f .github/workflows/p7-diag-final.yml
          rm -f .github/workflows/p7-corrigir-online-final.yml
          rm -f docs/P7_CI_FINAL.txt
          rm -f docs/P7_CI_FINAL.status

      - name: Commitar correção final
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P7: atualizar testes do fluxo online para bundle modular'
          git push origin HEAD:agent/p7-pedido-service
