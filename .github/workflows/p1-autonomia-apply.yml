name: Aplicar P1 autonomia operacional

on:
  push:
    branches:
      - agent/p1-autonomia-operacional

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-autonomia-operacional
          fetch-depth: 0

      - name: Preservar compatibilidade dos testes existentes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_p1_autonomia.py')
          s = p.read_text(encoding='utf-8')
          trecho = '''cliente = replace_once(cliente, "                return { dia: diaSimulado, hora: horaSimulada };", "                return { dia: diaSimulado, hora: horaSimulada, minuto: 0 };", "horário teste com minuto")\n'''
          if trecho not in s:
              raise SystemExit('Trecho de compatibilidade não encontrado')
          p.write_text(s.replace(trecho, '', 1), encoding='utf-8')
          PY

      - name: Aplicar alterações P1
        run: python scripts/apply_p1_autonomia.py

      - name: Completar autonomia de adicionais
        run: python scripts/p1_fixups.py

      - name: Testes backend e segurança
        run: node --test tests/backend-security.test.js

      - name: Testes fechamento P0
        run: node --test tests/fechamento-p0.test.js

      - name: Frontend compila
        run: node --test --test-name-pattern="scripts locais e scripts embutidos compilam" tests/frontend-integrity.test.js

      - name: Frontend restante
        run: node --test --test-name-pattern="^(?!scripts locais e scripts embutidos compilam).*" tests/frontend-integrity.test.js

      - name: Testes autonomia operacional
        run: node --test tests/autonomia-operacional.test.js

      - name: Sintaxe config operacional
        run: node --check frontend/config-operacional.js

      - name: Sintaxe configuração admin
        run: node --check frontend/configuracao.js

      - name: Sintaxe PDV/Relatório
        run: node --check frontend/eliel.js

      - name: Integridade do diff
        run: git diff --check

      - name: Publicar commit na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P1: autonomia operacional dinâmica"
          git push origin HEAD:agent/p1-autonomia-operacional
