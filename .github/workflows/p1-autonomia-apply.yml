name: Aplicar P1 autonomia operacional

on:
  push:
    branches:
      - agent/p1-autonomia-operacional

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch
        uses: actions/checkout@v4
        with:
          ref: agent/p1-autonomia-operacional
          fetch-depth: 0

      - name: Aplicar alterações P1
        run: python scripts/apply_p1_autonomia.py

      - name: Validar alterações
        run: |
          npm test
          node --check frontend/config-operacional.js
          node --check frontend/configuracao.js
          git diff --check

      - name: Publicar commit na branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P1: autonomia operacional dinâmica"
          git push origin HEAD:agent/p1-autonomia-operacional
