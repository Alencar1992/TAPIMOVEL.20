name: P14 aplicar limpeza de legado

on:
  push:
    branches:
      - agent/p14-limpeza-legado
    paths:
      - scripts/apply-p14.js
      - .github/workflows/p14-aplicar.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p14-limpeza-legado
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar P14
        run: node scripts/apply-p14.js

      - name: Validar
        run: npm run ci

      - name: Registrar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para registrar."
            exit 0
          fi
          git commit -m "P14: remover legado sem consumidor"
          git push origin HEAD:agent/p14-limpeza-legado
