name: Aplicar P2 storage em Sheets

on:
  push:
    branches:
      - agent/p2-storage-sheets

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p2-storage-sheets
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar migração P2
        run: python3 scripts/apply_p2_storage_v4.py

      - name: Testes
        run: npm test

      - name: Validar diff
        run: git diff --check

      - name: Commitar resultado final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "P2: migrar filas operacionais para Google Sheets"
          git push origin HEAD:agent/p2-storage-sheets
