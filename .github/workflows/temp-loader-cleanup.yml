name: Temp loader cleanup

on:
  push:
    branches:
      - chore/fechamento-loader-tapi-tudo-2

permissions:
  contents: write

jobs:
  patch-cliente:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/fechamento-loader-tapi-tudo-2
      - name: Alinha cache-buster do cliente
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/cliente.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="./config.js?v=20260828.1"></script>'
          new = '<script src="./config.js?v=20260828.3"></script>'
          if old not in text:
              raise SystemExit('Versão anterior do config.js não encontrada no cliente.html')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit da alteração
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/cliente.html
          git commit -m "chore: alinha cache-buster do cliente" || exit 0
          git push origin HEAD:chore/fechamento-loader-tapi-tudo-2
