name: P7 diagnóstico final

on:
  push:
    branches:
      - agent/p7-pedido-service
    paths:
      - .github/workflows/p7-diag-final.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p7-pedido-service
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capturar CI completo
        shell: bash
        run: |
          set +e
          npm run ci > docs/P7_CI_FINAL.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > docs/P7_CI_FINAL.status

      - name: Registrar diagnóstico
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/P7_CI_FINAL.txt docs/P7_CI_FINAL.status
          git commit -m 'P7: registrar falhas finais do CI'
          git push origin HEAD:agent/p7-pedido-service
