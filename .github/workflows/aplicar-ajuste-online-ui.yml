name: Aplicar ajuste Online e Produção

on:
  push:
    branches:
      - agent/ajuste-online-producao-alertas
    paths:
      - scripts/apply-ajuste-online-ui.js
      - .github/workflows/aplicar-ajuste-online-ui.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ajuste-online-producao-alertas
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar ajuste
        run: node scripts/apply-ajuste-online-ui.js

      - name: Validar
        run: npm run ci

      - name: Registrar alterações finais
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend tests docs
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional."
            exit 0
          fi
          git commit -m "hotfix: organizar pedidos online e reforçar alertas"
          git push origin HEAD:agent/ajuste-online-producao-alertas
