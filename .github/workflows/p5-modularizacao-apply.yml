name: P5 modularização repositories

on:
  push:
    branches:
      - agent/p5-modularizacao-repositories
    paths:
      - scripts/apply_p5_modularizacao.py
      - .github/workflows/p5-modularizacao-apply.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p5-modularizacao-repositories
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar modularização
        run: python scripts/apply_p5_modularizacao.py

      - name: Executar CI completo
        run: npm run ci

      - name: Validar módulos criados
        run: |
          test -f apps-script/SheetsRepository.gs
          test -f apps-script/PropertiesRepository.gs
          test -f apps-script/SecurityUtils.gs
          grep -q 'function obterScriptProperties_()' apps-script/PropertiesRepository.gs
          grep -q 'function hashSeguro_(' apps-script/SecurityUtils.gs
          grep -q 'function obterOuCriarAbaFila_(' apps-script/SheetsRepository.gs

      - name: Remover aplicador temporário
        run: |
          rm scripts/apply_p5_modularizacao.py
          rm .github/workflows/p5-modularizacao-apply.yml

      - name: Commitar produto final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'P5: modularizar repositories e utilitários de segurança'
          git push origin HEAD:agent/p5-modularizacao-repositories
