name: P7 diagnóstico completo 2

on:
  push:
    branches:
      - agent/p7-pedido-service
    paths:
      - .github/workflows/p7-diagnostico-2.yml

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p7-pedido-service
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar correção conhecida e capturar CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('tests/frontend-integrity.test.js')
          texto = p.read_text(encoding='utf-8')
          antigo = '  const backend = fs.readFileSync(path.join(root, "apps-script/Code.gs"), "utf8");'
          novo = '''  const appsScriptDir = path.join(root, "apps-script");
          const backend = fs.readdirSync(appsScriptDir)
            .filter(nome => nome.endsWith(".gs"))
            .sort()
            .map(nome => fs.readFileSync(path.join(appsScriptDir, nome), "utf8"))
            .join("\\n\\n");'''

          if antigo in texto:
              texto = texto.replace(antigo, novo, 1)
              p.write_text(texto, encoding='utf-8')
          PY

          set +e
          npm run ci > docs/P7_CI_DIAGNOSTICO_2.txt 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > docs/P7_CI_DIAGNOSTICO_2.status

      - name: Registrar diagnóstico na branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/P7_CI_DIAGNOSTICO_2.txt docs/P7_CI_DIAGNOSTICO_2.status
          git commit -m 'P7: registrar segundo diagnóstico do CI'
          git push origin HEAD:agent/p7-pedido-service
