name: Aplicar P3 config operacional em Sheets

on:
  push:
    branches:
      - agent/p3-config-operacional-sheets

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p3-config-operacional-sheets
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar migração P3
        run: python3 scripts/apply_p3_config_sheets.py

      - name: Testes
        run: npm test

      - name: Validar diff esperado
        run: |
          git diff -- apps-script/Code.gs tests/backend-security.test.js tests/config-operacional-sheets.test.js
          test -n "$(git status --short)"

      - name: Commitar resultado final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script/Code.gs tests/backend-security.test.js tests/config-operacional-sheets.test.js
          git rm .github/workflows/p3-config-sheets-apply.yml scripts/apply_p3_config_sheets.py
          git commit -m "P3: migrar configuração operacional para Google Sheets"
          git push origin HEAD:agent/p3-config-operacional-sheets
