name: P12 aplicar performance Sheets

on:
  push:
    branches:
      - agent/p12-performance-sheets
    paths:
      - scripts/apply-p12.js
      - .github/workflows/p12-aplicar.yml

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/p12-performance-sheets
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar P12
        run: node scripts/apply-p12.js

      - name: Validar
        run: npm run ci

      - name: Registrar alterações
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps-script scripts tests
          if git diff --cached --quiet; then
            echo "Nenhuma alteração adicional para registrar."
            exit 0
          fi
          git commit -m "P12: aplicar performance segura do Sheets"
          git push origin HEAD:agent/p12-performance-sheets
