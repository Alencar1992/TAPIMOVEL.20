<style>
  :root { --bg:#f5f7fb; --card:#fff; --txt:#1f2937; --muted:#6b7280; --primary:#2563eb; --danger:#dc2626; }
  body.dark { --bg:#111827; --card:#1f2937; --txt:#f9fafb; --muted:#9ca3af; --primary:#3b82f6; }
  *{ box-sizing:border-box; font-family:Inter,Arial,sans-serif; }
  body{ margin:0; background:var(--bg); color:var(--txt); }
  .app{ display:grid; grid-template-columns:220px 1fr; min-height:100vh; }
  .sidebar{ padding:18px; background:var(--card); box-shadow:2px 0 8px #0001; display:flex; flex-direction:column; gap:10px; }
  .sidebar button{ border:0; border-radius:8px; padding:10px; cursor:pointer; background:#e5e7eb; transition:.2s; }
  .sidebar button:hover{ transform:translateY(-1px); background:#d1d5db; }
  .sidebar .danger{ background:#fee2e2; color:#b91c1c; }
  main{ padding:20px; }
  header{ display:flex; justify-content:space-between; align-items:center; }
  .section{ display:none; }
  .section.active{ display:block; }
  .card{ background:var(--card); border-radius:14px; padding:16px; box-shadow:0 8px 24px #0001; margin-top:16px; }
  form{ display:grid; gap:10px; }
  label{ display:grid; gap:6px; font-size:14px; }
  input, select, button{ padding:10px; border-radius:8px; border:1px solid #d1d5db; }
  button{ background:var(--primary); color:#fff; border:0; cursor:pointer; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .hidden{ display:none; }
  .progress{ margin:10px 0; }
  .bar{ height:10px; border-radius:999px; background:#e5e7eb; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:0; transition:width .6s ease; }
  .green{ background:#16a34a; } .yellow{ background:#eab308; } .red{ background:#ef4444; }
  .netflix-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  .n-btn.pending{ background:#ef4444; } .n-btn.pago{ background:#22c55e; }
  #toast{ color:var(--muted); font-size:13px; }
  @media (max-width: 900px){ .app{ grid-template-columns:1fr; } .grid-2{ grid-template-columns:1fr; } }
</style>
