<!DOCTYPE html>
<html>
  <head>
    <base target="_top" />
    <?!= include('Style'); ?>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Finance SaaS</h1>
        <button onclick="setSection('dashboard')">Dashboard</button>
        <button onclick="setSection('entrada')">Entrada</button>
        <button onclick="setSection('saida')">Saída</button>
        <button onclick="setSection('entregas')">Entregas</button>
        <button onclick="setSection('netflix')">Netflix</button>
        <button onclick="setSection('devedores')">Devedores</button>
        <button onclick="fecharMes()" class="danger">Fechar Mês</button>
        <button onclick="toggleTheme()">Tema Escuro</button>
      </aside>

      <main>
        <header>
          <h2 id="section-title">Dashboard</h2>
          <div id="toast"></div>
        </header>

        <section id="dashboard" class="section active"></section>

        <section id="entrada" class="section">
          <div class="card">
            <h3>Registrar Entrada</h3>
            <form id="form-entrada">
              <label>Categoria
                <select name="categoria" id="entrada-categoria" onchange="onEntradaCategoria()">
                  <option>Entregas</option><option>Devedores</option><option>Outras</option>
                </select>
              </label>
              <label>Subcategoria
                <select name="subcategoria" id="entrada-subcategoria"></select>
              </label>
              <label>Descrição <input name="descricao" required /></label>
              <label>Valor <input name="valor" type="number" min="0.01" step="0.01" required /></label>
              <button type="submit">Salvar Entrada</button>
            </form>
          </div>
        </section>

        <section id="saida" class="section">
          <div class="card">
            <h3>Registrar Saída</h3>
            <form id="form-saida">
              <label>Descrição <input name="descricao" required /></label>
              <label>Valor <input name="valor" type="number" min="0.01" step="0.01" required /></label>
              <label>Quem
                <select name="quem" id="saida-quem" onchange="onQuemChange()"></select>
              </label>
              <label id="quem-manual-wrap" class="hidden">Quem (manual) <input name="quemManual" /></label>
              <label>Forma de pagamento <input name="formaPagamento" required /></label>
              <label>Parcelas <input name="parcelas" type="number" min="1" /></label>
              <button type="submit">Salvar Saída</button>
            </form>
          </div>
        </section>

        <section id="entregas" class="section">
          <div class="grid-2">
            <div class="card">
              <h3>Registrar Entrega</h3>
              <form id="form-entrega">
                <label>Categoria
                  <select name="categoria" id="entrega-categoria"></select>
                </label>
                <label>Quantidade <input name="quantidade" type="number" min="1" required /></label>
                <label>Valor Unitário <input name="valorUnitario" type="number" min="0.01" step="0.01" required /></label>
                <button type="submit">Salvar Entrega</button>
              </form>
              <button onclick="registrarPostagem()">Registrar Postagem (R$5)</button>
            </div>
            <div class="card" id="entregas-resumo"></div>
          </div>
        </section>

        <section id="netflix" class="section">
          <div class="card">
            <h3>Netflix</h3>
            <div id="netflix-users" class="netflix-grid"></div>
          </div>
        </section>

        <section id="devedores" class="section">
          <div class="grid-2">
            <div class="card">
              <h3>Novo Devedor</h3>
              <form id="form-devedor">
                <label>Nome <input name="nome" required /></label>
                <label>Descrição <input name="descricao" required /></label>
                <label>Valor <input name="valor" type="number" min="0.01" step="0.01" required /></label>
                <button type="submit">Salvar Devedor</button>
              </form>
            </div>
            <div class="card">
              <h3>Relatório Devedores</h3>
              <label>Filtrar Nome <input id="filtro-devedor" /></label>
              <button onclick="carregarDevedores()">Buscar</button>
              <button onclick="relatorioDevedores()">WhatsApp</button>
              <div id="devedores-lista"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <?!= include('Script'); ?>
  </body>
</html>
